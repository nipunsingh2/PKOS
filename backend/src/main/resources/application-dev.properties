# =========================
# Database
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/pkos
spring.datasource.username=postgres
spring.datasource.password=pkos@123

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT
# =========================
jwt.secret=PkosBackendSecretKeyForJwtAuthentication2026PkosSecretKey
jwt.expiration=86400000

# =========================
# Logging
# =========================
logging.level.org.springframework.security=DEBUG
logging.level.com.pkos.backend=DEBUG

#==========================
#Flyway
#==========================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# spring.flyway.enabled=true


# logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# =========================
# Redis
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =========================
# File Upload
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

pkos.ocr.tesseract.datapath=C:/Program Files/Tesseract-OCR/tessdata
pkos.ocr.tesseract.language=eng

# =========================
# Gemini AI
# =========================
gemini.api.key=${GEMINI_API_KEY}
gemini.embedding-model=gemini-embedding-2
gemini.embedding-dimension=3072
gemini.embedding-version=1
gemini.chat-model=gemini-3.5-flash


# Semantic Search
pkos.search.semantic.threshold=0.70
pkos.search.semantic.limit=10


##################################################
# LLM
##################################################
# llm.provider=openrouter
llm.provider=gemini
llm.retry.max-attempts=3
llm.retry.delay=500ms
llm.fallback.enabled=true

##################################################
# OpenRouter
##################################################
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.chat-model=nvidia/nemotron-3-ultra-550b-a55b:free
openrouter.site-url=http://localhost:8080
openrouter.app-name=PKOS

##################################################
# Memory
##################################################
pkos.memory.similarity-threshold=0.92
pkos.memory.semantic.top-k=5


############################################
# Search
############################################
pkos.search.keyword-weight=0.6
pkos.search.semantic-weight=0.4
pkos.search.max-results=100
pkos.search.snippet-length=200
pkos.search.semantic-threshold=0.0


